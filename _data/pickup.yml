# トップページいちばん上の「いま推しのお得」枠。上から順に最大3つ表示。
# end を過ぎたものはページを開いた時点で自動で消える（ビルド時にも外す）。
# 書き方:
# - title: 見出し（20字くらいまで）
#   detail: ひとこと説明（40字くらいまで。数字は公式で確認したものだけ）
#   code: クーポンコード（なければ消す）
#   start: "2026-10-24 20:00"   # 始まる前は「◯月◯日 ◯時から」と出る。なければ消す
#   end: "2026-10-27 01:59"     # 必須
#   url: ボタンの飛び先（公式ページなど）
#   rakuten: true               # 楽天のページならアフィリエイトリンクで包む
#   big: "最大10倍"            # いちばん大きく見せる数字（公式で確認したものだけ）
#   big_note: ポイント還元       # 数字の下の小さい説明
#   reason: 推す理由を1〜2文で。運営者の体験は team/owner.md にあるものだけ
#   button: ボタンの文字
#   post: /otoku/xxx/           # くわしい記事（なければ消す）
#
# 終了日が公式で「未定」「終了日は決まり次第お知らせ」のキャンペーン:
#   end を書かずに、代わりに次の2つを書く（ほかのキーは上と同じ）。
#   ongoing: true               # 終了日未定。「開催中・終了日は未定（◯月◯日に確認）」と出る
#   checked: "2026-10-25"       # 必須。最後に公式ページで「まだやっている」と確かめた日
#   checked から7日たつと自動で消える。続いていれば毎朝 checked を今日の日付に直す。
#   checked がないと表示されない。終了日が発表されたら ongoing と checked を消して end を書く。
