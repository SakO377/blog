  start: "2026-10-24 20:00"
  end: "2026-10-27 01:59"
  url: https://event.rakuten.co.jp/campaign/point-up/marathon/
  rakuten: true
  button: 楽天のページを開く
  post: /otoku/rakuten-this-week/
