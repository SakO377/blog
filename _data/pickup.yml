  start: "2026-10-24 20:00"
  end: "2026-10-27 09:59"
  url: https://event.rakuten.co.jp/campaign/point-up/marathon/
  rakuten: true
  button: 公式のエントリーページへ
  post: /otoku/rakuten-marathon-1000yen/
