{%- assign cat = site.data.categories | where: "slug", include.post.categories[0] | first -%}
<a class="card" href="{{ include.post.url | relative_url }}">
  <div class="card-img"><img src="{% include eyecatch.html post=include.post %}" alt="" loading="lazy"><span class="chip chip-{{ cat.slug }}">{{ cat.name }}</span></div>
  <div class="card-body">
    <h3>{{ include.post.title | escape }}</h3>
    <time>{{ include.post.date | date: site.date_format }}</time>
  </div>
</a>
