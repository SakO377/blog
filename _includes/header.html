<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect x="4" y="3" width="22" height="26" rx="4" fill="#FF7A59"/><rect x="9" y="9" width="12" height="3" rx="1.5" fill="#fff"/><rect x="9" y="15" width="12" height="3" rx="1.5" fill="#fff"/><circle cx="24" cy="24" r="6" fill="#FFC94D"/><path d="M21.5 24l1.8 1.8 3.2-3.6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>{{ site.title }}</span>
    </a>
  </div>
  <nav class="cat-nav"><div class="wrap cat-nav-inner">
    {%- for cat in site.data.categories -%}
      {%- if site.categories[cat.slug] -%}
      <a href="{{ '/category/' | append: cat.slug | append: '/' | relative_url }}"{% if page.slug == cat.slug or page.categories[0] == cat.slug %} class="active"{% endif %}>{{ cat.name }}</a>
      {%- endif -%}
    {%- endfor -%}
  </div></nav>
</header>
