<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <span class="logo-mark" aria-hidden="true"></span><span class="logo-text">{{ site.title }}</span><span class="logo-en">ERABIKATA NOTE</span>
    </a>
  </div>
  <nav class="cat-nav"><div class="wrap cat-nav-inner">
    {%- for cat in site.data.categories -%}
      {%- if site.categories[cat.slug] -%}
      <a href="{{ '/category/' | append: cat.slug | append: '/' | relative_url }}"{% if page.slug == cat.slug or page.categories[0] == cat.slug %} class="active"{% endif %}>{{ cat.name }}</a>
      {%- endif -%}
    {%- endfor -%}
  </div></nav>
</header>
