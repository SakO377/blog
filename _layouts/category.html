---
layout: default
---
{%- assign cat = site.data.categories | where: "slug", page.slug | first -%}
<div class="cat-hero" style="background-image:url('{{ '/assets/img/cat/' | append: page.slug | append: '.svg' | relative_url }}')"><div class="wrap"><h1>{{ cat.name }}</h1></div></div>
<div class="wrap">
  <div class="cards">{% for post in site.categories[page.slug] %}{% include card.html post=post %}{% endfor %}</div>
</div>
