---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: site.minima.date_format }}</time>
      {%- for c in page.categories -%}
        {%- assign cat = site.data.categories | where: "slug", c | first -%}
        ・<a href="{{ '/category/' | append: c | append: '/' | relative_url }}">{{ cat.name | default: c }}</a>
      {%- endfor -%}
    </p>
  </header>
  {% include pr.html %}
  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>
</article>
