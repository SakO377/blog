title: えらびかたノート
description: 一人暮らしの家電・部屋づくり・自炊・スマホ代を、買ったあとの暮らしが楽しみになる選び方で紹介。楽天のお得な買い方もまとめています。
url: "https://erabikata-note.pages.dev"
baseurl: ""
lang: ja
author:
  name: えらびかたノート編集部
logo: /assets/img/og/otoku.png
timezone: Asia/Tokyo
# Google Search Console の所有権確認（消さない）
webmaster_verifications:
  google: "SNCyaXB-NROUyc8n-8TKrwNN9EeG2vZWgTVQZQ-ESwI"
future: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
permalink: /:categories/:year/:month/:day/:title/
# 楽天アフィリエイトIDを取得したらここに入れる（例: "1a2b3c4d.5e6f7a8b.1a2b3c4e.5f6a7b8c"）
rakuten_affiliate_id: "589d2316.9e3179a4.589d2317.3eb9397c"
exclude:
  - AUTOPOST.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - team
  - scripts
date_format: "%Y.%m.%d"
# 楽天ウェブサービスの「Webアプリケーション」で取得した値（商品カードの写真・価格の表示に使う）
rakuten_app_id: ""
rakuten_access_key: ""
defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }
